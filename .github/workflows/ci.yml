name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Python syntax
        run: python -m compileall -q backend scripts nat

      - name: Startup script syntax
        run: |
          bash -n scripts/start.sh
          python -m py_compile scripts/enroll_hosts.py

      - name: Python tests
        run: python -m pytest -q

      - name: Ansible syntax
        run: |
          ansible-galaxy collection install -r requirements.yml
          for playbook in playbooks/*.yml; do
            ansible-playbook -i localhost, "$playbook" --syntax-check
          done
          ansible-playbook -i localhost, tests/ansible/dgx_detection.yml

      - name: Ansible lint
        run: ansible-lint --profile min playbooks

      - name: Python vulnerability audit
        run: python -m pip_audit -r backend/requirements.txt

      - name: Compose config
        run: docker compose config --quiet

      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Frontend audit
        working-directory: frontend
        run: npm audit --audit-level=moderate

      - name: Rust tests
        run: cargo test --manifest-path tools/dgx-doc-ingester/Cargo.toml

      - name: Rust vulnerability audit
        run: |
          cargo install cargo-audit --locked
          cargo audit --file tools/dgx-doc-ingester/Cargo.lock
