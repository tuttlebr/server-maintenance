services:
  web:
    build: .
    ports:
      - "${FLEET_PORT:-8080}:8000"
    volumes:
      - ./ansible.cfg:/app/ansible/ansible.cfg:ro
      - ./group_vars:/app/ansible/group_vars:ro
      - ./host_vars:/app/ansible/host_vars:ro
      - ./playbooks:/app/ansible/playbooks:ro
      - ./scripts:/app/ansible/scripts:ro
      - ./templates:/app/ansible/templates:ro
      - fleet-ssh-agent:/run/fleet-agent:ro
      - ${SSH_KNOWN_HOSTS_PATH:-./.fleet-ssh/known_hosts}:/run/fleet-known-hosts-seed:ro
      - ${FLEET_KUBECONFIG_PATH:-/dev/null}:/run/fleet-kubeconfig/config:ro
      - ./docs:/app/docs:ro
      - fleet-data:/app/data
    env_file:
      - .env
    environment:
      SSH_AUTH_SOCK: /run/fleet-agent/agent.sock
      SSH_KNOWN_HOSTS_FILE: /app/data/ssh/known_hosts
      SSH_KNOWN_HOSTS_SEED_FILE: /run/fleet-known-hosts-seed
      KUBECONFIG: /run/fleet-kubeconfig/config
      # This binary is built into the web image; don't inherit a stale host path.
      DOCS_INGESTER_BIN: /usr/local/bin/fleet-doc-ingester
      # The .env default is host-facing; containers reach Milvus by service name.
      MILVUS_URI: http://milvus:19530
    restart: always
    read_only: false
    tmpfs:
      - /tmp
      - /home/fleet/.ansible:uid=10001,gid=10001,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      nat:
        condition: service_started
        required: false
      milvus:
        condition: service_started
        required: false
      ssh-agent-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  ssh-agent-proxy:
    build: ./ssh-agent-proxy
    volumes:
      - ${SSH_AUTH_SOCK_PATH:?SSH_AUTH_SOCK_PATH must point to a dedicated SSH agent socket}:/run/host-agent:ro
      - fleet-ssh-agent:/run/fleet-agent
    restart: always
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "test", "-S", "/run/fleet-agent/agent.sock"]
      interval: 2s
      timeout: 1s
      retries: 10

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      # Keep metadata paired with the new local-storage index. Legacy metadata
      # references objects in MinIO; see README before upgrading an existing stack.
      - etcd-local-data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 5
    restart: always

  milvus:
    image: milvusdb/milvus:v2.4.21
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      # Supported by standalone Milvus; all vector data stays in this volume.
      COMMON_STORAGETYPE: local
      LOCALSTORAGE_PATH: /var/lib/milvus/data
    volumes:
      - milvus-local-data:/var/lib/milvus
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 90s
    restart: always
  nat:
    build: ./nat
    volumes:
      - ./docs:/app/docs:ro
    environment:
      - AI_HELPER_API_KEY=${AI_HELPER_API_KEY:-}
      - AI_HELPER_MODEL=${AI_HELPER_MODEL:-}
      - AI_HELPER_BASE_URL=${AI_HELPER_BASE_URL:-}
      - EMBED_API_KEY=${EMBED_API_KEY:-${AI_HELPER_API_KEY:-}}
      - EMBED_BASE_URL=${EMBED_BASE_URL:-${AI_HELPER_BASE_URL:-}}
      - EMBED_MODEL=${EMBED_MODEL:-nvidia/qwen/qwen3-embedding-0.6b}
      - EMBED_DIM=${EMBED_DIM:-}
      - MILVUS_URI=http://milvus:19530
      - KUBERNETES_MCP_SERVER=${KUBERNETES_MCP_SERVER:-}
      - KUBERNETES_MCP_TOKEN=${KUBERNETES_MCP_TOKEN:-}
      - UNIFI_MCP_SERVER=${UNIFI_MCP_SERVER:-}
      - UNIFI_MCP_TOKEN=${UNIFI_MCP_TOKEN:-}
    depends_on:
      milvus:
        condition: service_healthy
    restart: always
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  fleet-data:
  fleet-ssh-agent:
  etcd-local-data:
  milvus-local-data:
