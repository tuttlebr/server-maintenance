retrievers:
  fleet_retriever:
    _type: milvus_retriever
    uri: ${MILVUS_URI:-http://milvus:19530}
    collection_name: fleet_docs
    embedding_model: fleet_embedder
    top_k: 3
    search_params:
      metric_type: L2
      params:
        nprobe: 10
  fleet_job_retriever:
    _type: milvus_retriever
    uri: ${MILVUS_URI:-http://milvus:19530}
    collection_name: fleet_job_logs
    embedding_model: fleet_embedder
    primary_field: text
    vector_field: vector
    output_fields:
      - source
      - heading
      - text
      - job_id
      - status
      - finished_at
    top_k: 20
    search_params:
      metric_type: L2
      params:
        nprobe: 10

function_groups:
  dynamo_mcp_server:
    _type: mcp_client
    include:
      - searchDocs
    tool_call_timeout: 45
    reconnect_enabled: true
    reconnect_max_attempts: 3
    session_idle_timeout: 600
    tool_overrides:
      searchDocs:
        description: >-
          Search NVIDIA Dynamo inference runtime docs. Args: query.
          Returns: doc passages. Use for Dynamo-specific API/config
          questions.
    server:
      transport: streamable-http
      url: https://docs.nvidia.com/dynamo/_mcp/server
  aiperf_mcp_server:
    _type: mcp_client
    include:
      - searchDocs
    tool_call_timeout: 45
    reconnect_enabled: true
    reconnect_max_attempts: 3
    session_idle_timeout: 600
    tool_overrides:
      searchDocs:
        description: >-
          Search NVIDIA AIPerf docs. Args: query.
          Returns: doc passages. Use for AIPerf-specific API/config
          questions.
    server:
      transport: streamable-http
      url: https://docs.nvidia.com/aiperf/_mcp/server
  nvcf_mcp_server:
    _type: mcp_client
    include:
      - searchDocs
    tool_call_timeout: 45
    reconnect_enabled: true
    reconnect_max_attempts: 3
    session_idle_timeout: 600
    tool_overrides:
      searchDocs:
        description: >-
          Search NVIDIA Cloud Functions docs. Args: query.
          Returns: doc passages. Use for NVIDIA Cloud Functions-specific
          API/config questions.
    server:
      transport: streamable-http
      url: https://docs.nvidia.com/nvcf/_mcp/server
  dsx_mcp_server:
    _type: mcp_client
    include:
      - searchDocs
    tool_call_timeout: 45
    reconnect_enabled: true
    reconnect_max_attempts: 3
    session_idle_timeout: 600
    tool_overrides:
      searchDocs:
        description: >-
          Search NVIDIA DSX docs. Args: query.
          Returns: doc passages. Use for DSX-specific API/config
          questions.
    server:
      transport: streamable-http
      url: https://docs.nvidia.com/dsx/_mcp/server

functions:
  fleet_docs:
    _type: nat_retriever
    retriever: fleet_retriever
    topic: >-
      Search indexed Fleet Manager guidance and integration documentation.
      Coverage includes portable Linux operations, mixed-fleet UI workflows,
      NVIDIA DGX and supporting platform references, and any future device
      documentation added to the index.
  fleet_job_logs:
    _type: nat_retriever
    retriever: fleet_job_retriever
    topic: >-
      Search redacted completed Fleet Manager operation logs for successful,
      failed, and cancelled runs. The index contains job metadata, playbook,
      target devices, timestamps, error summaries, recaps, bounded output,
      and a current latest-completed-job-per-device fleet snapshot. Use it for
      questions about the user's fleet, including job status and history,
      failures, storage capacity, host facts, GPUs and workloads, OS, drivers,
      CUDA, firmware, networking, services, health checks, reboots, and
      maintenance results. This is recorded job evidence, not live telemetry.

llms:
  fleet_llm:
    _type: openai
    api_type: chat_completion
    base_url: ${AI_HELPER_BASE_URL}
    api_key: ${AI_HELPER_API_KEY}
    model_name: ${AI_HELPER_MODEL}

embedders:
  fleet_embedder:
    _type: nim
    base_url: ${EMBED_BASE_URL}
    api_key: ${EMBED_API_KEY}
    model_name: ${EMBED_MODEL:-nvidia/qwen/qwen3-embedding-0.6b}

workflow:
  _type: tool_calling_agent
  tool_names:
    - fleet_docs
    - fleet_job_logs
    - dynamo_mcp_server
    - aiperf_mcp_server
    - nvcf_mcp_server
    - dsx_mcp_server
  llm_name: fleet_llm
  system_prompt: |
    You are Fleet Help, a read-only support and operations-analysis assistant for Fleet Manager. You can interpret Linux, Ansible, compute, edge, robotics, NVIDIA GPU, and DGX operational output, but you can only search the information exposed by your tools; you cannot inspect devices directly or start, change, or cancel operations.

    Your available information and specialist tools are:
    - fleet_docs: indexed Fleet Manager UI guidance plus integration documentation, including NVIDIA DGX and supporting platform references. Use it for hardware, drivers, firmware, networking, setup, service, troubleshooting, and exact UI pages, controls, effects, and follow-up checks.
    - fleet_job_logs: redacted completed operations with success, failure, or cancellation status; target devices; timestamps; error summary and recap; bounded output; and a generated snapshot of the latest completed job per registered device. Availability depends on which operations have run and what their logs captured.
    - dynamo_mcp_server: current NVIDIA Dynamo distributed inference runtime documentation.
    - aiperf_mcp_server: current NVIDIA AIPerf benchmarking documentation.
    - nvcf_mcp_server: current NVIDIA Cloud Functions documentation.
    - dsx_mcp_server: current NVIDIA DSX documentation.

    Tool-use rules:
    1. Use the relevant tool before saying that information is unavailable. Use the specialist documentation tool for Dynamo, AIPerf, NVCF, or DSX questions and fleet_docs for platform, integration, or Fleet Manager documentation and UI questions.
    2. Always search fleet_job_logs for questions about the user's fleet or devices, including follow-up questions. Carry device names and scope forward from the conversation when a follow-up omits them.
    3. Treat fleet_job_logs as historical observations. For an overall fleet status question, use the latest-completed-job-per-device snapshot, report failed, cancelled, and missing outcomes, and clearly say that job success is not a live health check.
    4. For remaining-storage questions, search the newest storage-bearing logs for every device in scope. Report per-device values by default and do not double-count filesystem aliases or shared storage.
    5. If no relevant completed job recorded the requested value, say exactly what evidence is missing and direct the user to the narrowest available Fleet Manager operation that will collect it. Do not claim that a documentation result describes the user's current fleet.
    6. Never invent tool results, live state, precision, or causality. When sources conflict, prefer the newest relevant observation and mention the conflict if it changes the answer. For mutating or destructive workflows, provide UI guidance and confirmation cautions; do not imply that you performed the action.

    Lead with the answer. Be concise and direct, with no greeting or filler. Use a compact list or table when device-by-device values are clearer than prose, and give step-by-step instructions only when the user asks how to do something.
