---
- name: Bulk Password Reset
  hosts: managed_hosts
  become: true
  vars:
    # Set a temporary password for all users. Pass with -e or through the UI.
    temp_password: ""
    
    # List of users to reset (if empty, will reset all non-system users)
    users_to_reset: []
    
    # Exclude these users from bulk reset
    exclude_users:
      - root
      - nobody
      - sync
      - shutdown
      - halt
      - "{{ admin_username | default(ansible_user | default(''), true) }}"
      
  tasks:
    - name: Validate temporary password was provided
      assert:
        that:
          - temp_password | length > 0
          - temp_password | length >= 12
          - "'{' not in temp_password"
          - "'}' not in temp_password"
        fail_msg: "temp_password must be at least 12 characters and must not contain template expressions."
      no_log: true

    - name: Validate requested users
      assert:
        that:
          - item is match('^[a-z_][a-z0-9_-]{0,31}$')
        fail_msg: "Unsafe username: {{ item }}"
      loop: "{{ users_to_reset }}"

    - name: Get passwd database
      getent:
        database: passwd

    - name: Read the configured regular-user UID range
      ansible.builtin.shell: >-
        awk '/^[[:space:]]*UID_MIN[[:space:]]+/ {min=$2}
        /^[[:space:]]*UID_MAX[[:space:]]+/ {max=$2}
        END {print (min ? min : 1000), (max ? max : 60000)}' /etc/login.defs
      register: regular_uid_range
      changed_when: false

    - name: Record regular-user UID bounds
      ansible.builtin.set_fact:
        regular_uid_min: "{{ regular_uid_range.stdout.split()[0] | int }}"
        regular_uid_max: "{{ regular_uid_range.stdout.split()[1] | int }}"
      changed_when: false

    - name: Require explicitly requested users to exist
      ansible.builtin.assert:
        that:
          - item in ansible_facts['getent_passwd']
          - item not in exclude_users
          - (ansible_facts['getent_passwd'][item][1] | int) >= (regular_uid_min | int)
          - (ansible_facts['getent_passwd'][item][1] | int) <= (regular_uid_max | int)
          - ansible_facts['getent_passwd'][item][5] | default('') not in ['/usr/sbin/nologin', '/sbin/nologin', '/bin/false']
        fail_msg: "User {{ item }} is not an eligible interactive account on {{ inventory_hostname }}"
      loop: "{{ users_to_reset }}"

    - name: Build non-system user list
      set_fact:
        discovered_users: "{{ (discovered_users | default([])) + [item.key] }}"
      loop: "{{ ansible_facts['getent_passwd'] | dict2items }}"
      when:
        - (item.value[1] | int) >= (regular_uid_min | int)
        - (item.value[1] | int) <= (regular_uid_max | int)
        - item.value[5] | default('') not in ['/usr/sbin/nologin', '/sbin/nologin', '/bin/false']

    - name: Parse user list
      set_fact:
        users_to_process: "{{ (users_to_reset if users_to_reset | length > 0 else discovered_users | default([])) | difference(exclude_users) }}"
        
    - name: Confirm before proceeding
      pause:
        prompt: |
          Will reset passwords for {{ users_to_process | length }} users on {{ inventory_hostname }}:
          {{ users_to_process | join(', ') }}

          Press Enter to continue or Ctrl+C to abort
      when: interactive_mode | default(true) | bool

    - name: Reset passwords
      user:
        name: "{{ item }}"
        password: "{{ temp_password | password_hash('sha512') }}"
        update_password: always
      loop: "{{ users_to_process }}"
      no_log: true
      
    - name: Force password change on next login
      command:
        argv:
          - chage
          - "-d"
          - "0"
          - "{{ item }}"
      loop: "{{ users_to_process }}"
      
    - name: Summary
      debug:
        msg:
          - "Password reset complete for {{ users_to_process | length }} users"
          - "All users must change password on next login"
