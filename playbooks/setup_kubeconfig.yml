---
- name: Setup System-wide Kubeconfig
  hosts: all
  become: true
  
  tasks:
    - name: Create kubernetes config directory
      file:
        path: /etc/kubernetes
        state: directory
        mode: '0755'

    - name: Copy kubeconfig to system location
      copy:
        src: "{{ kubeconfig_file | default('/home/brandon/.kube/config') }}"
        dest: /etc/kubernetes/admin.conf
        mode: '0644'
        owner: root
        group: root
      # when: kubeconfig_file is defined or ansible_check_mode

    - name: Create shell profile script for kubeconfig
      copy:
        dest: /etc/profile.d/kubernetes.sh
        content: |
          #!/bin/sh
          # System-wide kubeconfig configuration
          export KUBECONFIG=/etc/kubernetes/admin.conf
        mode: '0644'

    - name: Add KUBECONFIG to /etc/environment
      lineinfile:
        path: /etc/environment
        line: "KUBECONFIG=/etc/kubernetes/admin.conf"
        create: yes
