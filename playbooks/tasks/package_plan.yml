---
- name: Require apt on a Debian family device
  ansible.builtin.assert:
    that: ansible_facts.os_family == 'Debian'
    fail_msg: "APT updates require a Debian or Ubuntu device."

- name: Simulate apt updates without removing packages
  ansible.builtin.command:
    argv: [apt-get, --simulate, --no-remove, --no-install-recommends, dist-upgrade]
  environment:
    LC_ALL: C
  changed_when: false
  register: fleet_apt_plan

- name: Normalize package names and candidate versions
  ansible.builtin.set_fact:
    fleet_package_changes: "{{ fleet_apt_plan.stdout_lines | select('match', '^Inst ') | list | sort }}"
    fleet_package_targets: "{{ fleet_apt_plan.stdout_lines | select('match', '^Inst ') | map('regex_replace', '^Inst ([^ ]+)(?: \\[[^\\]]+\\])? \\(([^ ]+).*$', '\\1=\\2') | list | sort }}"

- name: Fingerprint exact package versions
  ansible.builtin.set_fact:
    fleet_package_fingerprint: "{{ ('apt:' ~ (fleet_package_targets | to_json)) | hash('sha256') }}"
