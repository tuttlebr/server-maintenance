---
- name: Create private operation results directory
  ansible.builtin.file:
    path: "{{ __fleet_results_dir }}/{{ __fleet_job_id }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  when: __fleet_job_id is defined

- name: Save operation result
  ansible.builtin.copy:
    content: "{{ fleet_report | to_json }}"
    dest: "{{ __fleet_results_dir }}/{{ __fleet_job_id }}/{{ fleet_report_name }}_{{ inventory_hostname }}.json"
    mode: "0600"
  delegate_to: localhost
  become: false
  when: __fleet_job_id is defined
