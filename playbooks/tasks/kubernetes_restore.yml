---
- name: Restore original scheduling only after verification
  when:
    - kubernetes_restore_required | default(false) | bool
    - kubernetes_node_found | default(false) | bool
  block:
    - name: Verify the host and Kubernetes node
      ansible.builtin.include_tasks: kubernetes_ready.yml

    - name: Restore the Kubernetes node to schedulable
      kubernetes.core.k8s_drain:
        state: uncordon
        name: "{{ kubernetes_resolved_node_name }}"
        kubeconfig: "{{ kubernetes_effective_kubeconfig | default(omit, true) }}"
        context: "{{ kubernetes_context | default(omit, true) }}"
      delegate_to: localhost
      become: false
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

    - name: Record successful scheduling restoration
      ansible.builtin.include_tasks: kubernetes_report.yml
      vars:
        fleet_kubernetes_phase: resumed
