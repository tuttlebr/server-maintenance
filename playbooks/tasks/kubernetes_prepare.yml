---
- name: Inspect local membership evidence
  ansible.builtin.include_tasks: kubernetes_indicators.yml

- name: Require an explicit maintenance mode
  ansible.builtin.assert:
    that:
      - fleet_maintenance_mode | default('unknown') in ['standalone', 'kubernetes']
      - fleet_maintenance_mode != 'standalone' or not kubernetes_membership_expected | bool
    fail_msg: "Configure the device's maintenance mode. A host with Kubernetes membership files cannot be treated as standalone."

- name: Initialize standalone scheduling state
  ansible.builtin.set_fact:
    kubernetes_restore_required: false
    kubernetes_node_found: false

- name: Prepare a Kubernetes member
  when: fleet_maintenance_mode == 'kubernetes'
  block:
    - name: Discover the selected cluster and node
      ansible.builtin.include_tasks: kubernetes_discover.yml

    - name: Require a unique node in an accessible cluster
      ansible.builtin.assert:
        that:
          - kubernetes_api_accessible | bool
          - kubernetes_node_found | bool
        fail_msg: "Cannot safely drain this node. Verify Kubernetes context, node identity, API connectivity and RBAC. {{ kubernetes_api_error }}"

    - name: Remember the original scheduling state
      ansible.builtin.set_fact:
        kubernetes_restore_required: "{{ not kubernetes_node_was_unschedulable | bool }}"

    - name: Record recovery information before draining
      ansible.builtin.include_tasks: kubernetes_report.yml
      vars:
        fleet_kubernetes_phase: preparing_drain

    - name: Drain while respecting disruption budgets
      ansible.builtin.include_tasks: kubernetes_drain.yml

    - name: Restore scheduling only after successful maintenance and verification
      ansible.builtin.debug:
        msg: "Scheduling is restored only when this play and its health checks succeed. Failure leaves the node cordoned for recovery."
      changed_when: kubernetes_restore_required | bool
      notify: Restore Kubernetes node scheduling
