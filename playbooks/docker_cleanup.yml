---
- name: Clear Docker and containerd cache
  hosts: managed_hosts
  become: true
  gather_facts: true
  tasks:
    - name: Record cleanup start
      ansible.builtin.include_tasks: tasks/save_operation_report.yml
      vars:
        fleet_report_name: execution
        fleet_report: "{{ {'schema_version': 1, 'report_type': 'execution', 'hostname': inventory_hostname, 'mutation_started': true} }}"

    - name: Clear unused images and build cache across available runtimes
      ansible.builtin.script:
        cmd: files/container_cleanup.py
        executable: "{{ ansible_facts.python.executable | default('/usr/bin/python3') }}"
      register: fleet_cleanup
      changed_when: true
      failed_when: false

    - name: Save runtime cleanup results
      ansible.builtin.include_tasks: tasks/save_operation_report.yml
      vars:
        fleet_report_name: cleanup
        fleet_report: "{{ (fleet_cleanup.stdout | from_json) | combine({'schema_version': 1, 'report_type': 'cleanup', 'hostname': inventory_hostname}) }}"
      when: fleet_cleanup.stdout | default('') | trim is match('^\\{')

    - name: Require completed runtime cleanup
      ansible.builtin.assert:
        that: fleet_cleanup.rc == 0
        fail_msg: "Cache cleanup is incomplete. {{ fleet_cleanup.stdout | default(fleet_cleanup.msg | default('No runtime result returned')) }}"
