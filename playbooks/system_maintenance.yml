---
- name: Update Managed Hosts
  hosts: managed_hosts
  become: true
  serial: 4

  tasks:
    - name: Upgrade Debian-family packages
      apt:
        upgrade: dist
        update_cache: true
        autoremove: true
        autoclean: true
        install_recommends: false
        cache_valid_time: 3600
      when: ansible_facts['os_family'] == "Debian"

    - name: Upgrade Red Hat-family packages
      dnf:
        name: "*"
        state: latest
        update_cache: true
      when: ansible_facts['os_family'] == "RedHat"

    # Firmware Maintenance

    - name: Install firmware update tooling
      apt:
        name: fwupd
        state: present
        install_recommends: false
      when: ansible_facts['os_family'] == "Debian"
      tags:
        - firmware

    - name: Refresh firmware metadata
      command: fwupdmgr refresh --force
      register: firmware_refresh
      changed_when: false
      failed_when: firmware_refresh.rc not in [0, 2]
      when: ansible_facts['os_family'] == "Debian"
      tags:
        - firmware

    - name: Apply available firmware updates
      command: fwupdmgr update -y
      register: firmware_update
      changed_when: >
        firmware_update.rc == 0 and
        (
          (firmware_update.stdout | default('')) ~
          (firmware_update.stderr | default(''))
        ) is not search(
          'No updates|No updatable devices|No releases|No upgrades|no available firmware updates'
        )
      failed_when: false
      when: ansible_facts['os_family'] == "Debian"
      tags:
        - firmware

    - name: Print firmware update failure
      debug:
        msg: |
          WARNING: Firmware update failed on {{ inventory_hostname }}.
          fwupdmgr rc={{ firmware_update.rc }}
          {{ (firmware_update.stderr | default(firmware_update.stdout, true)) | trim }}
      when:
        - ansible_facts['os_family'] == "Debian"
        - firmware_update.rc not in [0, 2]
      tags:
        - firmware

    # NFS Cache Configuration

    - name: Install cachefilesd
      apt:
        name: cachefilesd
        state: present
      when: ansible_facts['os_family'] == "Debian"

    - name: Enable and start cachefilesd
      systemd:
        name: cachefilesd
        state: started
        enabled: true
      when: ansible_facts['os_family'] == "Debian"

    # NFS Mount Configuration
    # Configure fstab_mounts and nfs_mounts in group_vars/all.yml.

    - name: Ensure configured fstab mounts are mounted and enabled at boot
      ansible.posix.mount:
        src: "{{ item.src }}"
        path: "{{ item.path }}"
        opts: "{{ item.opts }}"
        state: "{{ item.state | default('mounted') }}"
        fstype: "{{ item.fstype | default('nfs') }}"
        boot: true
      loop: "{{ fstab_mounts | default([]) }}"
      register: configured_fstab_mount_results
      when:
        - fstab_mounts is defined
        - fstab_mounts | length > 0
      tags:
        - mounts

    - name: Ensure NFS mount points exist
      file:
        path: "{{ item.path }}"
        state: directory
      loop: "{{ nfs_mounts | default([]) }}"
      when:
        - nfs_mounts is defined
        - nfs_mounts | length > 0
      tags:
        - mounts

    - name: Ensure NFS entries in fstab
      lineinfile:
        path: /etc/fstab
        line: "{{ item.src }} {{ item.path }} nfs {{ item.opts }} 0 0"
        regexp: "{{ item.src | regex_escape }}\\s"
        state: present
      loop: "{{ nfs_mounts | default([]) }}"
      register: nfs_fstab_results
      when:
        - nfs_mounts is defined
        - nfs_mounts | length > 0
      tags:
        - mounts

    - name: Ensure securityfs entry in fstab
      lineinfile:
        path: /etc/fstab
        line: "securityfs /sys/kernel/security securityfs defaults 0 0"
        regexp: "^[^#\\s]+\\s+/sys/kernel/security\\s+securityfs\\s+"
        state: present
      register: securityfs_fstab_result
      tags:
        - mounts

    - name: Reload systemd daemon after fstab changes
      systemd:
        daemon_reload: true
      when: >
        (configured_fstab_mount_results.changed | default(false)) or
        (nfs_fstab_results.changed | default(false)) or
        (securityfs_fstab_result.changed | default(false))
      tags:
        - mounts

    - name: Mount all filesystems from fstab
      command: mount -a
      when: >
        (configured_fstab_mount_results.changed | default(false)) or
        (nfs_fstab_results.changed | default(false)) or
        (securityfs_fstab_result.changed | default(false))
      tags:
        - mounts

    - name: Verify /etc/fstab can be parsed
      command: findmnt --verify
      changed_when: false
      tags:
        - mounts

    - name: Get fstab entries disabled for automatic mounting
      shell: >
        awk '$1 !~ /^[[:space:]]*#/ && $1 != "" && $3 != "swap" &&
        NF >= 4 && $4 ~ /(^|,)noauto(,|$)/ &&
        $4 !~ /(^|,)x-systemd[.]automount(,|$)/ {print $2}' /etc/fstab
      register: fstab_noauto_mounts
      changed_when: false
      tags:
        - mounts

    - name: Fail if any fstab entries are not enabled for automatic mounting
      fail:
        msg: |
          fstab entries on {{ inventory_hostname }} are disabled for automatic mounting after reboot:
          {{ fstab_noauto_mounts.stdout_lines | join(', ') }}
          Remove the noauto option or pair it with x-systemd.automount.
      when: fstab_noauto_mounts.stdout_lines | length > 0
      tags:
        - mounts

    - name: Get expected mount points from /etc/fstab
      shell: >
        awk '$1 !~ /^[[:space:]]*#/ && $1 != "" && $3 != "swap" &&
        NF >= 4 {print $2}' /etc/fstab
      register: fstab_expected_mounts
      changed_when: false
      tags:
        - mounts

    - name: Get currently mounted filesystems
      command: findmnt -rno TARGET
      register: current_mounts
      changed_when: false
      tags:
        - mounts

    - name: Record fstab entries that are not currently mounted
      set_fact:
        missing_fstab_mounts: >-
          {{ fstab_expected_mounts.stdout_lines |
             difference(current_mounts.stdout_lines) }}
      tags:
        - mounts

    - name: Mount missing fstab entries
      command:
        argv:
          - mount
          - "{{ item }}"
      loop: "{{ missing_fstab_mounts }}"
      when: missing_fstab_mounts | length > 0
      tags:
        - mounts

    - name: Get currently mounted filesystems after remediation
      command: findmnt -rno TARGET
      register: current_mounts_after_remediation
      changed_when: false
      tags:
        - mounts

    - name: Fail if fstab entries are still not mounted
      fail:
        msg: |
          fstab entries on {{ inventory_hostname }} are not currently mounted after remediation:
          {{
            (
              fstab_expected_mounts.stdout_lines |
              difference(current_mounts_after_remediation.stdout_lines)
            ) | join(', ')
          }}
      when: >
        (
          fstab_expected_mounts.stdout_lines |
          difference(current_mounts_after_remediation.stdout_lines)
        ) | length > 0
      tags:
        - mounts

    # Inotify Kernel Tuning

    - name: Configure inotify sysctl limits
      copy:
        dest: /etc/sysctl.d/99-inotify.conf
        content: |
          fs.inotify.max_user_instances=1024
          fs.inotify.max_user_watches=524288
        owner: root
        group: root
        mode: "0644"
      register: inotify_sysctl
      when: "'kubernetes' in group_names"

    - name: Apply inotify sysctl settings
      command: sysctl --system
      when:
        - "'kubernetes' in group_names"
        - inotify_sysctl.changed | default(false)

    # GPU Information

    - name: Register nvidia-smi output
      command: nvidia-smi --query-gpu=gpu_name,gpu_bus_id,driver_version --format=csv
      register: gpu_info
      ignore_errors: true
      changed_when: false
      when: "'nvidia_gpu' in group_names or 'gpu' in group_names"

    - name: Print nvidia-smi info
      ansible.builtin.debug:
        var: gpu_info.stdout_lines
      when: "'nvidia_gpu' in group_names or 'gpu' in group_names"

    # Docker Maintenance

    - name: Ensure the docker daemon is running
      ansible.builtin.systemd:
        state: started
        name: docker
        enabled: true
        daemon_reload: true

    - name: Prune dangling Docker images
      command: docker system prune -f -a
      ignore_errors: true
      register: docker_image_prune

    - name: Print Docker image prune information
      ansible.builtin.debug:
        var: docker_image_prune.stdout_lines

    - name: Prune unused Docker networks
      command: docker network prune -f
      ignore_errors: true
      register: docker_network_prune

    - name: Print Docker network prune information
      ansible.builtin.debug:
        var: docker_network_prune.stdout_lines

    # Kubernetes Container Runtime Maintenance

    - name: Ensure the containerd daemon is running
      ansible.builtin.systemd:
        state: started
        name: containerd
        enabled: true
        daemon_reload: true
      when: "'kubernetes' in group_names"

    - name: Prune dangling containerd images
      command: nerdctl --namespace k8s.io system prune -f -a
      ignore_errors: true
      register: containerd_image_prune
      when: "'kubernetes' in group_names"

    - name: Print containerd image prune information
      ansible.builtin.debug:
        var: containerd_image_prune.stdout_lines
      when: "'kubernetes' in group_names"

    # Kernel Maintenance

    - name: Remove old Debian kernels
      shell: |
        dpkg -l 'linux-*' |
        sed '/^ii/!d;/'"$(uname -r | sed "s/$.*$-$[^0-9]\+$/\1/")"'/d;
        s/^[^ ]* [^ ]* $[^ ]*$.*/\1/;/[0-9]/!d' |
        xargs apt-get -y purge
      register: kernel_cleanup
      changed_when: kernel_cleanup.stdout != ""
      when: ansible_facts['os_family'] == "Debian"

    # Disk Space

    - name: Discover mounted storage
      ansible.builtin.include_tasks: tasks/discover_storage.yml

    - name: Print mounted storage capacity
      ansible.builtin.debug:
        var: storage_mounts

    # Zombie Process Remediation

    - name: Count zombie processes
      shell: ps -eo stat= | awk '$1 ~ /^Z/ {count++} END {print count+0}'
      register: zombie_process_count
      changed_when: false

    - name: List zombie processes
      shell: ps -eo pid=,ppid=,stat=,comm= | awk '$3 ~ /^Z/ {print}'
      register: zombie_processes
      changed_when: false
      when: zombie_process_count.stdout | int > 0

    - name: Print zombie processes before remediation
      ansible.builtin.debug:
        var: zombie_processes.stdout_lines
      when: zombie_process_count.stdout | int > 0

    - name: Reboot hosts after firmware updates or zombie process detection
      ansible.builtin.reboot:
        reboot_timeout: 1200
      when: >
        (firmware_update.changed | default(false)) or
        (
          (firmware_update.rc | default(0)) not in [0, 2] and
          (
            (firmware_update.stderr | default('')) ~
            (firmware_update.stdout | default(''))
          ) is search('Writing|Restarting device')
        ) or
        (zombie_process_count.stdout | int > 0)

    - name: Verify zombie processes were cleared
      shell: ps -eo stat= | awk '$1 ~ /^Z/ {count++} END {print count+0}'
      register: zombie_process_count_after_reboot
      changed_when: false
      failed_when: zombie_process_count_after_reboot.stdout | int > 0
      when: zombie_process_count.stdout | int > 0

    # Reboot Check

    - name: Check if reboot is required
      block:
        - name: Check for reboot-required flag
          stat:
            path: /var/run/reboot-required
          register: reboot_required_file

        - name: Check for processes using old deleted libraries
          shell: lsof | grep 'DEL.*lib' || true
          register: deleted_libs
          changed_when: false

        - name: Print reboot requirement message
          debug:
            msg: |
              WARNING: Server {{ inventory_hostname }} requires a manual reboot!
              Reasons:
              {% if reboot_required_file.stat.exists %}
              - System updates require a reboot
              {% endif %}
              {% if deleted_libs.stdout_lines | length > 0 %}
              - Processes using deleted libraries detected
              {% endif %}
          when: >
            reboot_required_file.stat.exists or
            deleted_libs.stdout_lines | length > 0

        - name: Include reboot status in maintenance report
          set_fact:
            reboot_needed: >-
              {{
                reboot_required_file.stat.exists or
                deleted_libs.stdout_lines | length > 0
              }}
