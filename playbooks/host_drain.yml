---
- name: Drain or Resume Host
  hosts: managed_hosts
  become: true
  gather_facts: true
  serial: "{{ maintenance_batch_size | default(1) }}"
  vars:
    drain_action: status
  tasks:
    - name: Validate drain action
      ansible.builtin.assert:
        that:
          - drain_action in ['status', 'drain', 'resume']
        fail_msg: "drain_action must be status, drain, or resume"

    - name: Check active GPU processes
      ansible.builtin.command:
        argv:
          - nvidia-smi
          - --query-compute-apps=pid,process_name,used_memory
          - --format=csv,noheader
      register: gpu_processes
      failed_when: false
      changed_when: false
      when: "'nvidia_gpu' in group_names"

    - name: Discover Kubernetes membership from the controller
      ansible.builtin.include_tasks: tasks/kubernetes_discover.yml

    - name: Require explicit Kubernetes maintenance configuration for changes
      ansible.builtin.assert:
        that:
          - fleet_maintenance_mode | default('unknown') == 'kubernetes'
          - kubernetes_api_accessible | bool
          - kubernetes_node_found | bool
        fail_msg: "Verify the device's cluster context and node identity before changing scheduling."
      when: drain_action != 'status'

    - name: Persist recovery information before changing scheduling
      ansible.builtin.include_tasks: tasks/kubernetes_report.yml
      vars:
        fleet_kubernetes_phase: "{{ 'preparing_drain' if drain_action == 'drain' else 'preparing_resume' }}"
      when: drain_action != 'status'

    - name: Verify health and readiness before resuming
      ansible.builtin.include_tasks: tasks/kubernetes_ready.yml
      when: drain_action == 'resume'

    - name: Drain Kubernetes node
      ansible.builtin.include_tasks: tasks/kubernetes_drain.yml
      when:
        - drain_action == 'drain'
        - kubernetes_node_found | bool

    - name: Uncordon Kubernetes node
      kubernetes.core.k8s_drain:
        state: uncordon
        name: "{{ kubernetes_resolved_node_name }}"
        kubeconfig: "{{ kubernetes_effective_kubeconfig | default(omit, true) }}"
        context: "{{ kubernetes_context | default(omit, true) }}"
      delegate_to: localhost
      become: false
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      register: kubernetes_uncordon_result
      failed_when: >-
        kubernetes_uncordon_result.failed | default(false)
        and not (force | default(false) | bool)
      when:
        - drain_action == 'resume'
        - kubernetes_node_found | bool

    - name: Persist final scheduling action
      ansible.builtin.include_tasks: tasks/kubernetes_report.yml
      vars:
        fleet_kubernetes_phase: "{{ 'drained' if drain_action == 'drain' else 'resumed' }}"
      when: drain_action != 'status'

    - name: Report drain status
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "Action: {{ drain_action }}"
          - "Kubernetes API accessible: {{ kubernetes_api_accessible }}"
          - "Kubernetes node visible: {{ kubernetes_node_found }}"
          - "Kubernetes node name: {{ kubernetes_resolved_node_name | default('') }}"
          - "Originally unschedulable: {{ kubernetes_node_was_unschedulable | default(false) }}"
          - "Active GPU processes: {{ gpu_processes.stdout_lines | default([]) }}"
          - >-
            Drain: {{
              (kubernetes_drain_result | default({})).result
              | default(
                  (kubernetes_emergency_drain_result | default({})).result
                  | default('skipped')
                )
            }}
          - "Resume: {{ kubernetes_uncordon_result.result | default('skipped') }}"
          - "API error: {{ kubernetes_api_error if not kubernetes_api_accessible else '' }}"
