---
- name: Reboot selected standalone nodes
  hosts: managed_hosts
  become: true
  gather_facts: false
  serial: "{{ maintenance_batch_size | default(1) }}"
  tasks:
    - name: Record that reboot is about to begin
      ansible.builtin.include_tasks: tasks/save_operation_report.yml
      vars:
        fleet_report_name: execution
        fleet_report: "{{ {'schema_version': 1, 'report_type': 'execution', 'hostname': inventory_hostname, 'mutation_started': true} }}"

    - name: Reboot the node and wait for it to return
      ansible.builtin.reboot:
        msg: "Reboot initiated by Fleet Manager"
        reboot_timeout: 1200
        connect_timeout: 10
        pre_reboot_delay: 0
        post_reboot_delay: 30
      register: fleet_reboot

    - name: Require a completed reboot
      ansible.builtin.assert:
        that: fleet_reboot.rebooted | default(false) | bool
        fail_msg: "The reboot did not complete. Check the node's power and SSH connectivity."

    - name: Save reboot result
      ansible.builtin.include_tasks: tasks/save_operation_report.yml
      vars:
        fleet_report_name: reboot
        fleet_report: "{{ {'schema_version': 1, 'report_type': 'reboot', 'hostname': inventory_hostname, 'rebooted': true, 'elapsed_seconds': fleet_reboot.elapsed | default(0)} }}"
