---
- name: Change User Password
  hosts: all
  become: true
  vars:
    target_username: ""
    new_password: ""
    force_change: "no"
  vars_prompt:
    - name: target_username
      prompt: "Enter username to change password for"
      private: no

    - name: new_password
      prompt: "Enter new password"
      private: yes
      confirm: yes

    - name: force_change
      prompt: "Force password change on next login? (yes/no)"
      default: "no"
      private: no

  tasks:
    - name: Validate password request
      assert:
        that:
          - target_username is match('^[a-z_][a-z0-9_-]{0,31}$')
          - new_password | length >= 12
          - "'{' not in new_password"
          - "'}' not in new_password"
        fail_msg: "Password request contains unsafe values"
      no_log: true

    - name: Check if user exists
      command:
        argv:
          - id
          - "{{ target_username }}"
      register: user_exists
      failed_when: false
      changed_when: false
      
    - name: Fail if user doesn't exist
      fail:
        msg: "User {{ target_username }} does not exist on {{ inventory_hostname }}"
      when: user_exists.rc != 0
      
    - name: Set user password
      user:
        name: "{{ target_username }}"
        password: "{{ new_password | password_hash('sha512') }}"
        update_password: always
      no_log: true
      
    - name: Force password change on next login
      command:
        argv:
          - chage
          - "-d"
          - "0"
          - "{{ target_username }}"
      when: force_change | bool
      
    - name: Display password status
      command:
        argv:
          - chage
          - "-l"
          - "{{ target_username }}"
      register: password_status
      changed_when: false
      
    - name: Show password status
      debug:
        msg: "{{ password_status.stdout_lines }}"
