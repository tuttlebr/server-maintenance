---
- name: Manage Users
  hosts: managed_hosts
  become: true
  gather_facts: true
  vars:
    user_records: []
    user_updates: []
    target_usernames: []
    user_groups: ""
    user_shell: ""
    force_password_change: true
  tasks:
    - name: Normalize structured account records
      ansible.builtin.set_fact:
        fleet_user_records: "{{ user_records }}"
        fleet_user_updates: "{{ user_updates }}"
      no_log: true

    - name: Accept legacy Full Name <email> CLI records
      ansible.builtin.set_fact:
        fleet_user_records: >-
          {{ fleet_user_records + [{
            'full_name': item | regex_replace(';$', '') | regex_search('^([^<]+)') | trim,
            'username': item | regex_search('(?<=<)[^@]+(?=@)'),
            'email': item | regex_search('(?<=<)[^>]+(?=>)')
          }] }}
      loop: "{{ user_info | default([]) }}"
      when: user_records | length == 0
      no_log: true

    - name: Normalize legacy shared account edits
      ansible.builtin.set_fact:
        fleet_user_updates: "{{ fleet_user_updates + [{'username': item, 'groups': user_groups, 'shell': user_shell}] }}"
      loop: "{{ target_usernames }}"
      when: user_updates | length == 0

    - name: Require a supported Linux platform
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family in ['Debian', 'RedHat']
          - (fleet_user_records | length > 0) or (fleet_user_updates | length > 0)
        fail_msg: "Select explicit accounts on a Debian or Red Hat family device."

    - name: Validate account names
      ansible.builtin.assert:
        that:
          - item is match('^[a-z_][a-z0-9_-]{0,31}$')
          - item not in ['root', ansible_user | default(''), admin_username | default('')]
        fail_msg: "Invalid or protected account {{ item }}"
      loop: "{{ (fleet_user_records | map(attribute='username') | list) + (fleet_user_updates | map(attribute='username') | list) }}"

    - name: Read existing accounts
      ansible.builtin.getent:
        database: passwd

    - name: Require update targets to exist
      ansible.builtin.assert:
        that: item.username in ansible_facts.getent_passwd
        fail_msg: "Account {{ item.username }} does not exist on {{ inventory_hostname }}. Use Add users first."
      loop: "{{ fleet_user_updates }}"
      loop_control:
        label: "{{ item.username }}"

    - name: Identify new accounts
      ansible.builtin.set_fact:
        fleet_new_accounts: "{{ fleet_user_records | rejectattr('username', 'in', ansible_facts.getent_passwd.keys()) | list }}"

    - name: Collect requested groups and shells
      ansible.builtin.set_fact:
        fleet_requested_groups: "{{ ((fleet_new_accounts + fleet_user_updates) | map(attribute='groups', default='') | join(',')).split(',') | reject('equalto', '') | unique | list }}"
        fleet_requested_shells: "{{ (fleet_new_accounts + fleet_user_updates) | map(attribute='shell', default='') | reject('equalto', '') | unique | list }}"

    - name: Validate supplementary groups
      ansible.builtin.assert:
        that: item is match('^[a-z_][a-z0-9_-]{0,31}$')
      loop: "{{ fleet_requested_groups }}"

    - name: Verify requested shell is allowed and installed
      ansible.builtin.command:
        argv: [test, -x, "{{ item }}"]
      changed_when: false
      loop: "{{ fleet_requested_shells }}"

    - name: Record that account changes are about to begin
      ansible.builtin.include_tasks: tasks/save_operation_report.yml
      vars:
        fleet_report_name: execution
        fleet_report: "{{ {'schema_version': 1, 'report_type': 'execution', 'hostname': inventory_hostname, 'mutation_started': true} }}"

    - name: Ensure requested supplementary groups exist
      ansible.builtin.group:
        name: "{{ item }}"
        state: present
      loop: "{{ fleet_requested_groups }}"

    - name: Update existing accounts without replacing their other groups
      ansible.builtin.user:
        name: "{{ item.username }}"
        comment: "{{ item.full_name | default(omit, true) }}"
        groups: "{{ item.groups | default(omit, true) }}"
        append: true
        shell: "{{ item.shell | default(omit, true) }}"
        state: present
      loop: "{{ fleet_user_updates }}"
      loop_control:
        label: "{{ item.username }}"

    - name: Create new accounts using system home defaults
      ansible.builtin.user:
        name: "{{ item.username }}"
        comment: "{{ item.full_name }}"
        shell: "{{ item.shell | default('/bin/bash', true) }}"
        groups: "{{ item.groups | default(omit, true) }}"
        append: true
        create_home: true
        state: present
        password: "{{ (default_password | password_hash('sha512')) if default_password | default('') else omit }}"
        update_password: on_create
      loop: "{{ fleet_new_accounts }}"
      no_log: true

    - name: Expire only an explicitly supplied initial password
      ansible.builtin.command:
        argv: [chage, -d, '0', "{{ item.username }}"]
      loop: "{{ fleet_new_accounts }}"
      when:
        - default_password | default('') | length > 0
        - force_password_change | bool
      changed_when: true

    - name: Observe resulting accounts
      ansible.builtin.include_tasks: tasks/account_report.yml
      vars:
        fleet_account_names: "{{ (fleet_user_records | map(attribute='username') | list) + (fleet_user_updates | map(attribute='username') | list) }}"
