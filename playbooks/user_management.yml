---
- name: Manage Users
  hosts: managed_hosts
  become: true
  gather_facts: true
  vars:
    user_records: []
    target_usernames: []
    user_groups: ""
    user_shell: ""
    force_password_change: true
  tasks:
    - name: Normalize structured account records
      ansible.builtin.set_fact:
        fleet_user_records: "{{ user_records }}"
      no_log: true

    - name: Accept legacy Full Name <email> CLI records
      ansible.builtin.set_fact:
        fleet_user_records: >-
          {{ fleet_user_records + [{
            'full_name': item | regex_replace(';$', '') | regex_search('^([^<]+)') | trim,
            'username': item | regex_search('(?<=<)[^@]+(?=@)'),
            'email': item | regex_search('(?<=<)[^>]+(?=>)')
          }] }}
      loop: "{{ user_info | default([]) }}"
      when: user_records | length == 0
      no_log: true

    - name: Require a supported Linux platform
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family in ['Debian', 'RedHat']
          - (fleet_user_records | length > 0) or (target_usernames | length > 0)
        fail_msg: "Select explicit accounts on a Debian or Red Hat family device."

    - name: Validate account names
      ansible.builtin.assert:
        that:
          - item is match('^[a-z_][a-z0-9_-]{0,31}$')
          - item not in ['root', ansible_user | default(''), admin_username | default('')]
        fail_msg: "Invalid or protected account {{ item }}"
      loop: "{{ (fleet_user_records | map(attribute='username') | list) + target_usernames }}"

    - name: Read existing accounts
      ansible.builtin.getent:
        database: passwd

    - name: Require update targets to exist
      ansible.builtin.assert:
        that: item in ansible_facts.getent_passwd
      loop: "{{ target_usernames }}"

    - name: Validate supplementary groups
      ansible.builtin.assert:
        that: item is match('^[a-z_][a-z0-9_-]{0,31}$')
      loop: "{{ user_groups.split(',') if user_groups else [] }}"

    - name: Verify requested shell is allowed and installed
      ansible.builtin.command:
        argv: [test, -x, "{{ user_shell }}"]
      changed_when: false
      when: user_shell | length > 0

    - name: Ensure requested supplementary groups exist
      ansible.builtin.group:
        name: "{{ item }}"
        state: present
      loop: "{{ user_groups.split(',') if user_groups else [] }}"

    - name: Update existing accounts without replacing their other groups
      ansible.builtin.user:
        name: "{{ item }}"
        groups: "{{ user_groups if user_groups else omit }}"
        append: true
        shell: "{{ user_shell if user_shell else omit }}"
      loop: "{{ target_usernames }}"

    - name: Identify new accounts
      ansible.builtin.set_fact:
        fleet_new_accounts: "{{ fleet_user_records | rejectattr('username', 'in', ansible_facts.getent_passwd.keys()) | list }}"

    - name: Create new accounts using system home defaults
      ansible.builtin.user:
        name: "{{ item.username }}"
        comment: "{{ item.full_name }}"
        shell: /bin/bash
        create_home: true
        state: present
        password: "{{ (default_password | password_hash('sha512')) if default_password | default('') else omit }}"
        update_password: on_create
      loop: "{{ fleet_new_accounts }}"
      no_log: true

    - name: Expire only an explicitly supplied initial password
      ansible.builtin.command:
        argv: [chage, -d, '0', "{{ item.username }}"]
      loop: "{{ fleet_new_accounts }}"
      when:
        - default_password | default('') | length > 0
        - force_password_change | bool
      changed_when: true

    - name: Observe resulting accounts
      ansible.builtin.include_tasks: tasks/account_report.yml
      vars:
        fleet_account_names: "{{ (fleet_user_records | map(attribute='username') | list) + target_usernames }}"
