---
- name: Install checked apt updates
  hosts: managed_hosts
  become: true
  gather_facts: true
  serial: "{{ maintenance_batch_size | default(1) }}"
  environment:
    LC_ALL: C
    DEBIAN_FRONTEND: noninteractive
  tasks:
    - name: Recompute the proposed transaction before changing the host
      ansible.builtin.include_tasks: tasks/package_plan.yml

    - name: Require a matching reviewed package preview
      ansible.builtin.assert:
        that:
          - fleet_approved_package_plans is defined
          - inventory_hostname in fleet_approved_package_plans
          - fleet_package_fingerprint == fleet_approved_package_plans[inventory_hostname]
        fail_msg: "Available packages changed since the check. No packages were installed. Check for apt updates again."

    - name: Install available updates
      when: fleet_package_targets | length > 0
      block:
        - name: Record that package installation is about to begin
          ansible.builtin.include_tasks: tasks/save_operation_report.yml
          vars:
            fleet_report_name: execution
            fleet_report: "{{ {'schema_version': 1, 'report_type': 'execution', 'hostname': inventory_hostname, 'mutation_started': true} }}"

        - name: Install the exact checked package versions
          ansible.builtin.command:
            argv: "{{ ['apt-get', '-o', 'DPkg::Lock::Timeout=120', '-o', 'Dpkg::Options::=--force-confdef', '-o', 'Dpkg::Options::=--force-confold', '--assume-yes', '--no-remove', '--no-install-recommends', 'install'] + fleet_package_targets }}"
          register: fleet_apt_install
          changed_when: true

        - name: Verify installed versions and package configuration
          ansible.builtin.command:
            argv: [dpkg, --audit]
          register: fleet_dpkg_audit
          changed_when: false
          failed_when: fleet_dpkg_audit.rc != 0 or fleet_dpkg_audit.stdout | trim | length > 0

        - name: Verify every approved version was installed
          ansible.builtin.command:
            argv: "{{ ['dpkg-query', '-W', '-f=${Version}', item.split('=')[0]] }}"
          loop: "{{ fleet_package_targets }}"
          register: fleet_installed_version
          changed_when: false
          failed_when: fleet_installed_version.rc != 0 or fleet_installed_version.stdout != item.split('=', 1)[1]

    - name: Check whether a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Save apt installation result
      ansible.builtin.include_tasks: tasks/save_operation_report.yml
      vars:
        fleet_report_name: apt_install
        fleet_report: "{{ {'schema_version': 1, 'report_type': 'apt_install', 'hostname': inventory_hostname, 'package_count': fleet_package_targets | length, 'reboot_required': reboot_required_file.stat.exists, 'packages': fleet_package_targets} }}"
