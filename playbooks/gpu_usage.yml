---
- name: GPU Usage Analysis
  hosts: gpu
  become: true
  gather_facts: false
  tasks:
    - name: Analyze GPU usage and resolve process owners
      ansible.builtin.script:
        cmd: >-
          files/gpu_usage.py --hostname {{ inventory_hostname | quote }}
          --platform {{ machine_type | default('unknown') | quote }}
        executable: "{{ ansible_python_interpreter if (ansible_python_interpreter is defined and ansible_python_interpreter not in ['auto', 'auto_silent', 'auto_legacy', 'auto_legacy_silent']) else '/usr/bin/python3' }}"
      register: gpu_report_json
      changed_when: false

    - name: Write GPU usage report as JSON
      ansible.builtin.copy:
        content: "{{ gpu_report_json.stdout_lines | last | from_json | to_json }}"
        dest: "/tmp/fleet_gpu_usage_report.json"
        mode: "0600"

    - name: Fetch GPU usage report to controller
      ansible.builtin.fetch:
        src: "/tmp/fleet_gpu_usage_report.json"
        dest: "{{ __fleet_scan_dir | default(playbook_dir ~ '/../data/scans') }}/gpu_usage_{{ inventory_hostname }}.json"
        flat: true

    - name: Fetch GPU result for this job
      ansible.builtin.fetch:
        src: "/tmp/fleet_gpu_usage_report.json"
        dest: "{{ __fleet_results_dir | default('/tmp/fleet-job-results') }}/{{ __fleet_job_id | default('manual') }}/gpu_{{ inventory_hostname }}.json"
        flat: true

    - name: Remove temporary GPU usage report
      ansible.builtin.file:
        path: "/tmp/fleet_gpu_usage_report.json"
        state: absent
