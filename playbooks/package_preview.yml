---
- name: Check for apt package updates
  hosts: managed_hosts
  become: true
  gather_facts: true
  environment:
    LC_ALL: C
    DEBIAN_FRONTEND: noninteractive
  tasks:
    - name: Require apt on a Debian family device
      ansible.builtin.assert:
        that: ansible_facts.os_family == 'Debian'
        fail_msg: "APT updates require a Debian or Ubuntu device."

    # Use the CLI so custom Python interpreters do not need python3-apt.
    - name: Refresh apt package lists
      ansible.builtin.command:
        argv: [apt-get, -o, DPkg::Lock::Timeout=120, -o, APT::Update::Error-Mode=any, update]
      register: fleet_apt_refresh
      changed_when: false
      failed_when: fleet_apt_refresh.rc != 0 or 'Failed to fetch' in (fleet_apt_refresh.stderr | default(''))
      retries: 3
      delay: 5
      until: fleet_apt_refresh.rc == 0 and 'Failed to fetch' not in (fleet_apt_refresh.stderr | default(''))

    - name: Compute proposed package transaction
      ansible.builtin.include_tasks: tasks/package_plan.yml

    - name: Save available package updates
      ansible.builtin.include_tasks: tasks/save_operation_report.yml
      vars:
        fleet_report_name: packages
        fleet_report: "{{ {'schema_version': 1, 'report_type': 'packages', 'hostname': inventory_hostname, 'family': ansible_facts.os_family, 'changes': fleet_package_changes, 'package_count': fleet_package_targets | length, 'fingerprint': fleet_package_fingerprint} }}"
