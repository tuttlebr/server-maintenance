---
- name: Maintenance Preflight Check
  hosts: managed_hosts
  become: true
  gather_facts: true
  vars:
    disk_warn_pct: 85
  tasks:
    - name: Check apt and dpkg lock holders
      shell: |
        pgrep -fa 'apt|apt-get|dpkg|unattended-upgrade' || true
      register: apt_lock_processes
      changed_when: false

    - name: Discover mounted storage
      ansible.builtin.include_tasks: tasks/discover_storage.yml

    - name: Check if reboot is required
      stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Check nvidia-smi availability
      command: nvidia-smi
      register: nvidia_smi_check
      failed_when: false
      changed_when: false
      when: "'nvidia_gpu' in group_names"

    - name: Check active GPU processes
      command: nvidia-smi --query-compute-apps=pid,process_name,used_memory --format=csv,noheader
      register: gpu_processes
      failed_when: false
      changed_when: false
      when: "'nvidia_gpu' in group_names"

    - name: Check Docker GPU workloads
      shell: |
        docker ps --filter "runtime=nvidia" --format "{{ '{{' }}.Names{{ '}}' }}" 2>/dev/null || true
      register: gpu_containers
      changed_when: false
      when: "'nvidia_gpu' in group_names"

    - name: Discover Kubernetes membership from the controller
      ansible.builtin.include_tasks: tasks/kubernetes_discover.yml

    - name: Check Fabric Manager status
      command: systemctl is-active nvidia-fabricmanager
      register: fabric_manager_status
      failed_when: false
      changed_when: false
      when: "'fabric_manager' in group_names"

    - name: Check DCGM status
      command: systemctl is-active dcgm
      register: dcgm_status
      failed_when: false
      changed_when: false
      when: "'fabric_manager' in group_names"

    - name: Check NVSM health
      command: nvsm show health
      register: nvsm_health
      failed_when: false
      changed_when: false
      when: "'dgx_workstation' in group_names"

    - name: Report preflight summary
      debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "Reachable: true"
          - "OS: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"
          - "Kernel: {{ ansible_facts['kernel'] }}"
          - "Mounted storage: {{ storage_mounts }}"
          - "Reboot required: {{ reboot_required_file.stat.exists }}"
          - "Apt/dpkg activity: {{ apt_lock_processes.stdout_lines | default([]) }}"
          - "nvidia-smi rc: {{ nvidia_smi_check.rc | default('N/A') }}"
          - "GPU processes: {{ gpu_processes.stdout_lines | default([]) }}"
          - "GPU containers: {{ gpu_containers.stdout_lines | default([]) }}"
          - "Kubernetes API accessible: {{ kubernetes_api_accessible }}"
          - "Kubernetes node: {{ kubernetes_resolved_node_name | default('not a member', true) }}"
          - "Kubernetes unschedulable: {{ kubernetes_node_was_unschedulable if kubernetes_node_found else 'N/A' }}"
          - "Fabric Manager: {{ fabric_manager_status.stdout | default('N/A') }}"
          - "DCGM: {{ dcgm_status.stdout | default('N/A') }}"
          - "NVSM rc: {{ nvsm_health.rc | default('N/A') }}"

    - name: Warn on high storage usage
      ansible.builtin.debug:
        msg: >-
          WARNING: {{ item.mountpoint }} ({{ item.type }}) is at
          {{ item.use_pct }}% on {{ inventory_hostname }}
      loop: "{{ storage_mounts }}"
      loop_control:
        label: "{{ item.mountpoint }}"
      when:
        - item.accessible | bool
        - item.use_pct | int >= disk_warn_pct

    - name: Warn on active apt or dpkg processes
      debug:
        msg: "WARNING: apt/dpkg activity detected on {{ inventory_hostname }}: {{ apt_lock_processes.stdout_lines }}"
      when: apt_lock_processes.stdout | length > 0

    - name: Warn on active GPU workloads
      debug:
        msg: "WARNING: active GPU workloads detected on {{ inventory_hostname }}: {{ gpu_processes.stdout_lines | default([]) }}"
      when:
        - "'nvidia_gpu' in group_names"
        - gpu_processes.stdout | default('') | length > 0

    - name: Compile maintenance assessment
      ansible.builtin.set_fact:
        maintenance_assessment:
          schema_version: 1
          report_type: assessment
          hostname: "{{ inventory_hostname }}"
          timestamp: "{{ ansible_date_time.iso8601 }}"
          summary:
            blocker_count: >-
              {{
                (1 if (storage_discovery_raw.rc | default(1)) != 0 else 0)
                + (1 if not (kubernetes_api_accessible | bool) else 0)
              }}
            warning_count: >-
              {{
                (storage_mounts | selectattr('accessible') | selectattr('use_pct', 'ge', disk_warn_pct) | list | length)
                + (1 if apt_lock_processes.stdout | default('') | length > 0 else 0)
                + (1 if gpu_processes.stdout | default('') | length > 0 else 0)
                + (1 if reboot_required_file.stat.exists else 0)
              }}
            pass_count: >-
              {{
                4
                - (1 if apt_lock_processes.stdout | default('') | length > 0 else 0)
                - (1 if gpu_processes.stdout | default('') | length > 0 else 0)
                - (1 if reboot_required_file.stat.exists else 0)
              }}
          warnings:
            high_storage: "{{ storage_mounts | selectattr('accessible') | selectattr('use_pct', 'ge', disk_warn_pct) | map(attribute='mountpoint') | list }}"
            package_activity: "{{ apt_lock_processes.stdout_lines | default([]) }}"
            gpu_processes: "{{ gpu_processes.stdout_lines | default([]) }}"
            reboot_required: "{{ reboot_required_file.stat.exists }}"
          details:
            os: "{{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"
            kernel: "{{ ansible_facts['kernel'] }}"
            kubernetes_api_accessible: "{{ kubernetes_api_accessible }}"
            kubernetes_node: "{{ kubernetes_resolved_node_name | default('') }}"
            kubernetes_unschedulable: "{{ kubernetes_node_was_unschedulable if kubernetes_node_found else false }}"
            storage_discovery_ok: "{{ storage_discovery_raw.rc | default(1) == 0 }}"

    - name: Write maintenance assessment as JSON
      ansible.builtin.copy:
        content: "{{ maintenance_assessment | to_json }}"
        dest: /tmp/fleet_maintenance_assessment.json
        mode: "0600"

    - name: Fetch maintenance assessment for this job
      ansible.builtin.fetch:
        src: /tmp/fleet_maintenance_assessment.json
        dest: "{{ __fleet_results_dir | default('/tmp/fleet-job-results') }}/{{ __fleet_job_id | default('manual') }}/assessment_{{ inventory_hostname }}.json"
        flat: true

    - name: Remove temporary maintenance assessment
      ansible.builtin.file:
        path: /tmp/fleet_maintenance_assessment.json
        state: absent
