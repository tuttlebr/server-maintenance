repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: end-of-file-fixer
      - id: detect-private-key
      - id: trailing-whitespace
      - id: check-yaml
      - id: mixed-line-ending
        args: ["--fix=lf"]
  - repo: local
    hooks:
      - id: ruff
        name: Python correctness (Ruff)
        entry: ruff check --config ruff.toml
        language: python
        additional_dependencies: ["ruff==0.17.1"]
        types: [python]
      - id: shell-syntax
        name: Shell syntax
        entry: bash -c 'for script in "$@"; do bash -n "$script" || exit 1; done' --
        language: system
        types: [shell]
      - id: backend-tests
        name: Backend tests
        entry: bash scripts/check-backend.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: frontend-tests
        name: Frontend tests
        entry: npm --prefix frontend test
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: frontend-build
        name: Frontend production build
        entry: npm --prefix frontend run build
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
  - repo: https://github.com/tuttlebr/nv-pre-commit
    rev: v0.0.5
    hooks:
      - id: detect-nv-keys
        # SHA-512 integrity hashes match the legacy 84-character key heuristic.
        exclude: ^frontend/package-lock\.json$
