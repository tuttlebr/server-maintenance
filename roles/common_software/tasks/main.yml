---
- name: Install common packages
  apt:
    name: "{{ common_packages }}"
    state: present
  when: ansible_facts['distribution'] in ['Debian', 'Ubuntu']

- name: Install common packages (RedHat)
  dnf:
    name: "{{ common_packages }}"
    state: present
  when: ansible_facts['os_family'] == 'RedHat'
